<script>
/* =========================================================
   1. API Client (same-origin cookies: credentials='include')
   ========================================================= */
const API = {
  async json(url, opts = {}) {
    const res = await fetch(url, {
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      ...opts,
      body: opts.body !== undefined ? (typeof opts.body === 'string' ? opts.body : JSON.stringify(opts.body)) : undefined,
    });
    const ct = res.headers.get('Content-Type') || '';
    let data = null;
    if (ct.includes('application/json')) {
      try { data = await res.json(); } catch (_) { data = null; }
    } else {
      data = await res.text();
    }
    if (!res.ok) {
      const msg = (data && data.error) ? data.error : `HTTP ${res.status}`;
      const err = new Error(msg);
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  },
  get(u) { return this.json(u, { method: 'GET' }); },
  post(u, body) { return this.json(u, { method: 'POST', body }); },
  put(u, body) { return this.json(u, { method: 'PUT', body }); },
  del(u) { return this.json(u, { method: 'DELETE' }); },
};

/* Auth */
const Auth = {
  _user: null,
  async me() {
    try { this._user = await API.get('/api/auth/me'); return this._user; }
    catch { this._user = null; return null; }
  },
  async login(username, password, captcha_id='', captcha='') {
    const res = await API.post('/api/auth/login', { username, password, captcha_id, captcha });
    this._user = res.user || null;
    return this._user;
  },
  async logout() {
    try { await API.post('/api/auth/logout', {}); } catch(_) {}
    this._user = null;
  },
  isAdmin() { return this._user && this._user.role === 'admin'; },
  isLogged() { return !!this._user; },
};

/* =========================================================
   2. UI helpers: toast, modal, format
   ========================================================= */
function toast(msg, type = 'info', dur = 3200) {
  const colors = {
    info:   'bg-brand text-white border-brand-dark',
    ok:     'bg-accent-green text-white border-accent-green',
    error:  'bg-accent-red text-white border-accent-red',
    warn:   'bg-accent-amber text-white border-accent-amber',
  };
  const el = document.createElement('div');
  el.className = `toast-enter rounded-xl px-4 py-3 text-sm shadow-lg border ${colors[type] || colors.info}`;
  el.innerHTML = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), dur);
}

function openModal(html) {
  const mount = document.getElementById('modal-mount');
  mount.innerHTML = `
    <div class="fixed inset-0 z-[80] flex items-center justify-center modal-backdrop bg-black/40" onclick="if(event.target===this)closeModal()">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 w-full max-w-xl mx-4 overflow-hidden" onclick="event.stopPropagation()">
        ${html}
      </div>
    </div>`;
}
function closeModal() { document.getElementById('modal-mount').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function fmtCost(v) { return (v || 0).toLocaleString('zh-CN', { minimumFractionDigits: 4, maximumFractionDigits: 4 }); }
function fmtInt(v) { return (v || 0).toLocaleString('zh-CN'); }
function fmtDate(s) { return (s || '').slice(0, 16).replace('T', ' '); }
function maskKey(s) { if (!s) return ''; if (s.length <= 10) return s; return s.slice(0, 5) + '••••••' + s.slice(-4); }
function $el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

/* Theme */
function toggleTheme() {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
}
if (localStorage.getItem('theme') === 'dark' ||
    (localStorage.getItem('theme') !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.classList.add('dark');
}

/* =========================================================
   3. Router (Hash)
   ========================================================= */
function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, queryStr = ''] = raw.split('?');
  const query = Object.fromEntries(new URLSearchParams(queryStr));
  return { path, query };
}
function navigate(hash) { location.hash = hash; }
function goHome() { navigate('/'); }

/* =========================================================
   4. Render Nav & Auth state
   ========================================================= */
function renderNav() {
  const links = document.getElementById('nav-links');
  const isLogged = Auth.isLogged();
  const isAdmin = Auth.isAdmin();
  const items = [
    { href: '#/', label: '首页', icon: 'i-home', match: p => p === '/' },
  ];
  if (isLogged) items.push({ href: '#/console', label: '控制台', icon: 'i-dashboard', match: p => p.startsWith('/console') });
  if (isAdmin) items.push({ href: '#/admin', label: '管理后台', icon: 'i-shield', match: p => p.startsWith('/admin') });
  const { path } = parseHash();
  links.innerHTML = items.map(it => `
    <a href="${it.href}" class="nav-item px-3 py-2 rounded-lg flex items-center gap-1.5 transition ${it.match(path) ? 'bg-brand-light dark:bg-brand/15 text-brand' : 'hover:bg-brand-light dark:hover:bg-brand/10 hover:text-brand'}">
      <svg class="w-4 h-4"><use href="#${it.icon}"/></svg>${it.label}
    </a>`).join('');

  const authNav = document.getElementById('auth-nav');
  if (Auth._user) {
    const dn = Auth._user.display_name || Auth._user.username;
    authNav.innerHTML = `
      <div class="flex items-center gap-2">
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800">
          <svg class="w-4 h-4 text-ink-soft dark:text-gray-400"><use href="#i-user"/></svg>
          <span class="text-sm font-medium text-ink dark:text-gray-200">${dn}</span>
          ${Auth.isAdmin() ? '<span class="text-xs px-1.5 py-0.5 rounded bg-brand/10 text-brand">管理员</span>' : ''}
        </div>
        <button onclick="doLogout()" class="px-3 py-2 rounded-lg text-sm font-semibold border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 flex items-center gap-1.5 transition">
          <svg class="w-4 h-4"><use href="#i-logout"/></svg>退出
        </button>
      </div>`;
  } else {
    authNav.innerHTML = `
      <button onclick="openLoginModal()" class="px-4 py-2 rounded-lg bg-brand text-white text-sm font-semibold hover:bg-brand-dark transition shadow-sm shadow-brand/30 flex items-center gap-1.5">
        <svg class="w-4 h-4"><use href="#i-user"/></svg>登录
      </button>`;
  }
}

/* =========================================================
   5. Modals: Login / Channel Edit / Token Create / User Edit / Pricing / Redeem
   ========================================================= */
function openLoginModal() {

        </h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-lg flex items-center justify-center text-ink-faint hover:bg-gray-100 dark:hover:bg-gray-700">
          <svg class="w-5 h-5"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="text-sm font-medium text-ink-soft dark:text-gray-400 mb-1.5 block">用户名</label>
          <input id="li-user" type="text" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-ink dark:text-white focus:ring-2 focus:ring-brand focus:border-transparent outline-none" placeholder="admin">
        </div>
        <div>
          <label class="text-sm font-medium text-ink-soft dark:text-gray-400 mb-1.5 block">密码</label>
          <input id="li-pass" type="password" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-ink dark:text-white focus:ring-2 focus:ring-brand focus:border-transparent outline-none" placeholder="至少 8 位">
        </div>
        <div id="li-captcha-wrap" class="hidden">
          <label class="text-sm font-medium text-ink-soft dark:text-gray-400 mb-1.5 block">验证码</label>
          <div class="flex gap-2 items-center">

            <button type="button" onclick="refreshCaptcha()" class="px-3 py-2 rounded-lg text-xs font-medium text-brand hover:bg-brand-light dark:hover:bg-brand/15">换一张</button>
            <input id="li-cap" type="text" class="flex-1 px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-ink dark:text-white focus:ring-2 focus:ring-brand focus:border-transparent outline-none" placeholder="输入验证码">
          </div>

        <button id="li-btn" onclick="submitLogin()" class="w-full py-2.5 rounded-xl bg-brand text-white font-semibold hover:bg-brand-dark transition shadow-lg shadow-brand/30 flex items-center justify-center gap-2">
          <svg class="w-4 h-4"><use href="#i-user"/></svg>登录

      </div>
    </div>`);
  maybeLoadCaptcha();
}
let captchaId = '';
async function maybeLoadCaptcha() {
  try {
    const r = await API.get('/api/auth/captcha');
    captchaId = r.id || '';
    const wrap = document.getElementById('li-captcha-wrap');
    if (!wrap) return;
    if (r.id && r.image) {
      wrap.classList.remove('hidden');
      document.getElementById('li-captcha-img').src = r.image;
    } else {
      wrap.classList.add('hidden');
    }
  } catch(e) {
    // captcha disabled
    captchaId = '';
    const w = document.getElementById('li-captcha-wrap');
    if (w) w.classList.add('hidden');
  }
}
async function refreshCaptcha() { await maybeLoadCaptcha(); }
async function submitLogin() {
  const u = document.getElementById('li-user').value.trim();
  const p = document.getElementById('li-pass').value;
  const cap = document.getElementById('li-cap') ? document.getElementById('li-cap').value.trim() : '';
  if (!u || !p) return toast('请输入用户名和密码', 'warn');
  const btn = document.getElementById('li-btn');
  btn.disabled = true; btn.innerHTML = '<svg class="w-4 h-4 spin"><use href="#i-bolt"/></svg>登录中...';
  try {
    await Auth.login(u, p, captchaId, cap);
    toast(`欢迎回来，${Auth._user.display_name || Auth._user.username}`, 'ok');
    closeModal();
    renderNav();
    router();
  } catch (e) {
    toast(e.message || '登录失败', 'error');
    refreshCaptcha();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg class="w-4 h-4"><use href="#i-user"/></svg>登录';
  }
}
async function doLogout() {

    </div>`;
  }
  return `<div>
    <label class="text-sm font-medium text-ink-soft dark:text-gray-400 mb-1.5 block">${label}${required ? ' <span class="text-accent-red">*</span>' : ''}</label>

async function createTokenForMe() {
  openFormModal('新建 API Key',

async function redeemCode(form) {
  const code = new FormData(form).get('code').trim();
  try {
    const r = await API.post('/api/redeem', { code });
    toast(`兑换成功，已到账 ${r.quota ? r.quota.toLocaleString() : ''} token`, 'ok');

  }

/* =========================================================
   9. Router entry + boot
   ========================================================= */
async function router() {
  const { path, query } = parseHash();
  renderNav();
  let view = 'home';
  if (path === '/' || path === '') view = 'home';
  else if (path === '/console') view = 'console';
  else if (path.startsWith('/admin')) view = 'admin';
  else { navigate('/'); return; }

  try {
    if (view === 'home')    await Views.home();
    if (view === 'console') await Views.console();
    if (view === 'admin')   await Views.admin();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    toast('页面加载失败: ' + e.message, 'error');
    console.error(e);
  }
}

window.addEventListener('hashchange', router);
(async function boot() {
  try { await Auth.me(); } catch (_) { /* not logged */ }
  renderNav();
  if (!location.hash) location.hash = '/';
  router();
})();
</script>
